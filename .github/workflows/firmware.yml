name: Firmware-Tests

on:
  push:
    paths: ['firmware/**', '.github/workflows/firmware.yml']
  pull_request:
    paths: ['firmware/**', '.github/workflows/firmware.yml']

jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simulation und Abnahmetests
        run: make -C firmware test
      - name: Auswertungsskript prüfen (Simulations-Log mit bekannten Werten)
        run: pip install numpy && make -C firmware ident

  teensy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ARM-Compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
      - name: Teensy-Core und Bibliotheken
        run: |
          mkdir -p deps/libs
          git clone --depth 1 https://github.com/PaulStoffregen/cores deps/cores
          for r in tonton81/FlexCAN_T4 PaulStoffregen/Wire PaulStoffregen/SPI PaulStoffregen/EEPROM adafruit/Adafruit_NeoPixel adafruit/Adafruit_BNO08x adafruit/Adafruit_BusIO adafruit/Adafruit_Sensor; do
            git clone --depth 1 https://github.com/$r deps/libs/$(basename $r)
          done
      - name: Firmware für Teensy 4.1 bauen
        run: firmware/tools/build_teensy.sh deps/cores deps/libs
      - uses: actions/upload-artifact@v4
        with:
          name: exo-firmware-teensy41
          path: firmware/build/teensy/exo.hex

  esp32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: ESP32-Core und Bibliotheken
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install GxEPD2 NimBLE-Arduino
      - name: Sketch für ESP32-C3 bauen (Anzeige am Oberarm, Bluetooth)
        run: |
          mkdir -p build/esp32_display_ble
          cp firmware/esp32/esp32_display_ble.ino firmware/esp32/status.h build/esp32_display_ble/
          arduino-cli compile --fqbn esp32:esp32:esp32c3 --warnings default build/esp32_display_ble
