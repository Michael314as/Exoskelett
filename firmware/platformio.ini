; Teensy 4.1 bauen und flashen:  pio run -t upload
; PC-Tests (Simulation, Treiber, Teensy-Testbuild):  make test
[platformio]
src_dir = src

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_unflags = -std=gnu++14
build_flags = -std=gnu++17 -Wall
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
    adafruit/Adafruit BNO08x@^1.2.5
